<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeatherTime · Projex Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#F2928A}a:hover{color:#DE8A85}
button{font:inherit}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(139,43,41,.5)}70%{box-shadow:0 0 0 8px rgba(139,43,41,0)}100%{box-shadow:0 0 0 0 rgba(139,43,41,0)}}
@keyframes cring{0%{transform:translate(-50%,-50%) scale(.6);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes chalo{0%,100%{opacity:.85}50%{opacity:.6}}
@keyframes ctoast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cpop{from{opacity:0}to{opacity:1}}
.c-live{animation:cpulse 2s infinite}
.c-ring{animation:cring 2s ease-out infinite}
.c-halo{animation:chalo 4s ease-in-out infinite}
.c-toast{animation:ctoast .25s ease-out}
.c-pop{animation:cpop .25s ease-out}
.c-item{transition:background .15s,border-color .15s}
.c-item:hover{background:#25272B}
.c-ghost{transition:background .15s}
.c-ghost:hover{background:#2B2D32}
.c-kpi{transition:border-color .15s,background .15s}
.c-kpi:hover{border-color:#5A5F67}
.c-mk{transition:left .4s,top .4s}
.c-mk:hover .c-pin{filter:brightness(1.08)}
.c-glass{background:rgba(14,15,17,0.76);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button:focus-visible{outline:2px solid #F2928A;outline-offset:2px}
</style>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#0E0F11}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
</style>
</head>

        valColor: s.offline ? '#666B73' : cText(cScale(L.stops, v)),
        barW: s.offline ? '0%' : Math.round(wxClamp(v / vmax, 0.04, 1) * 100) + '%',
        bg: sel ? '#25272B' : 'transparent', border: sel ? 'rgba(139,43,41,0.55)' : 'transparent',
        pressed: sel ? 'true' : 'false',
        select: select(s.id)
      };
    });
    const counts = { online: 0, warning: 0, offline: 0 };
    all.forEach((s) => { counts[wxStatus(s)]++; });
    const netBar = ['online', 'warning', 'offline'].filter((k) => counts[k] > 0).map((k) => ({ n: counts[k], color: C_ST[k].fg, label: C_ST[k].label }));

    const lats = all.map((s) => s.lat), lons = all.map((s) => s.lon);
    const minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    const minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
    const pos = (s) => ({ x: 10 + 72 * (s.lon - minLon) / (maxLon - minLon), y: 22 + 62 * (maxLat - s.lat) / (maxLat - minLat) });
    const inv = (1 / st.zoom).toFixed(3);
    const halos = visible.filter((s) => !s.offline).map((s) => {
      const p = pos(s);
      const c = cScale(L.stops, val(s));
      return { x: p.x.toFixed(2) + '%', y: p.y.toFixed(2) + '%', size: '240px', bg: 'radial-gradient(circle, ' + cRgba(c, 0.32) + ' 0%, ' + cRgba(c, 0.10) + ' 42%, ' + cRgba(c, 0) + ' 70%)' };
    });
    const markers = visible.map((s) => {
      const isSel = s.id === st.selected;
      const code = wxStatus(s);
      const p = pos(s);
      return {
        x: p.x.toFixed(2) + '%', y: p.y.toFixed(2) + '%', inv: inv, z: isSel ? 20 : 10,
        value: s.offline ? 'sem sinal' : wxN(val(s), L.dec) + (st.layer === 't' ? '°' : ''),
        fill: s.offline ? '#3E4248' : cScale(L.stops, val(s)),
        txt: (() => { if (s.offline) return '#F2F3F5'; const c = cHex(cScale(L.stops, val(s))); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) > 150 ? '#0E0F11' : '#F2F3F5'; })(),
        ring: isSel ? '#F2F3F5' : (s.offline ? '#3E4248' : cScale(L.stops, val(s))),
        h: isSel ? '40px' : '32px', padX: isSel ? '14px' : '10px', font: isSel ? '16px' : '13px',
        shape: s.kind === 'Solo' ? '50%' : '2px',
        alert: !!alertIds[s.id], stColor: C_ST[code].fg,
        id: s.id, idColor: isSel ? '#F2928A' : '#D3D6DB',
        aria: s.name + ': ' + (s.offline ? 'sem dados' : wxN(val(s), L.dec) + ' ' + L.unit) + ', ' + C_ST[code].label,
        select: select(s.id)
      };
    });

    const idx = Math.max(0, all.findIndex((x) => x.id === st.selected));
    const s = all[idx];
    const sp = pos(s);
    const code = wxStatus(s), dash = s.offline;
    const right = sp.x > 62;
    const pop = {
      x: sp.x.toFixed(2) + '%', y: sp.y.toFixed(2) + '%',
      transform: 'translate(' + (right ? 'calc(-100% - 46px)' : '46px') + ', -78%) scale(' + inv + ')',
      origin: right ? '100% 50%' : '0% 50%',
      id: s.id, kind: s.kind, name: s.name,
      stLabel: C_ST[code].label, stFg: C_ST[code].popFg, stBg: C_ST[code].popBg,
      value: dash ? '—' : wxN(val(s), L.dec), unit: L.unit,
      mini: [
        { k: 'Temp.', v: dash ? '—' : wxN(s.t, 1) + '°' },
        { k: 'Umid.', v: dash ? '—' : Math.round(s.h) + '%' },
        { k: 'Vento', v: dash ? '—' : wxN(s.w, 1) }
      ]
    };
    const zoomOrigin = sp.x.toFixed(1) + '% ' + sp.y.toFixed(1) + '%';

    const layers = Object.keys(C_LAYERS).map((k) => ({
      label: C_LAYERS[k].label, icon: C_LAYERS[k].icon, pressed: st.layer === k ? 'true' : 'false',
      bg: st.layer === k ? 'linear-gradient(90deg, #4D2A2B, #8B2B29)' : 'transparent', fg: st.layer === k ? '#F2F3F5' : '#D3D6DB',
      pick: () => this.setState({ layer: k, hover: -1 })
    }));
    const stops = L.stops;
    const legendGradient = 'linear-gradient(90deg, ' + stops.map((s2, i) => s2[1] + ' ' + Math.round(i * 100 / (stops.length - 1)) + '%').join(', ') + ')';
    const fmtStop = (v) => (Number.isInteger(v) ? String(v) : wxN(v, 1));

    const avgHist = (k, sum) => st.times.map((_, i) => { const t = live.reduce((a, x) => a + x.hist[k][i], 0); return sum ? t : t / Math.max(1, live.length); });
    const windiest = live.reduce((m, x) => (x.w > m.w ? x : m), live[0]);
    const rainSum = live.reduce((a, x) => a + x.rain, 0);
    const kpiBtn = (k, o, arr) => {
      const on = st.layer === k && !st.alertsOnly;
      const spk = wxSpark(arr, 200, 60);
      const c = cScale(C_LAYERS[k].stops, (C_LAYERS[k].stops[1][0] + C_LAYERS[k].stops[C_LAYERS[k].stops.length - 1][0]) / 2);
      return Object.assign(o, {
        pressed: on ? 'true' : 'false', line: spk.line, area: spk.area, spark: c,
        border: on ? 'rgba(139,43,41,0.6)' : '#27292E', bg: on ? '#202226' : '#18191C',
        iconColor: on ? '#F2F3F5' : c, iconBg: on ? 'linear-gradient(90deg, #4D2A2B, #8B2B29)' : cRgba(c, 0.14), icon: C_LAYERS[k].icon, valColor: '#F2F3F5',
        pick: () => this.setState({ layer: k, hover: -1, alertsOnly: false })
      });
    };
    const kpis = [
      kpiBtn('t', { label: 'Temperatura média', value: wxN(avgOf('t'), 1), unit: '°C', sub: 'Máx. ' + wxN(Math.max.apply(null, live.map((x) => x.t)), 1) + ' °C' }, avgHist('t')),
      kpiBtn('h', { label: 'Umidade média', value: wxN(avgOf('h'), 0), unit: '%', sub: 'Pressão ' + wxN(avgOf('p'), 1) + ' hPa' }, avgHist('h')),
      kpiBtn('w', { label: 'Vento máximo', value: wxN(windiest.w, 1), unit: 'm/s', sub: windiest.name }, st.times.map((_, i) => Math.max.apply(null, live.map((x) => x.hist.w[i])))),
      kpiBtn('rain', { label: 'Chuva na rede', value: wxN(rainSum, 1), unit: 'mm/h', sub: live.filter((x) => x.rain > 0).length + ' estação(ões) com chuva' }, avgHist('rain', true)),
      {
        label: 'Alertas ativos', value: String(active.length), unit: '', sub: st.alertsOnly ? 'Filtrando o mapa · clique p/ limpar' : 'Clique para filtrar o mapa',
        pressed: st.alertsOnly ? 'true' : 'false', border: st.alertsOnly ? 'rgba(242,193,78,0.7)' : '#27292E', bg: st.alertsOnly ? '#211D11' : '#18191C',
        iconColor: '#F2C14E', iconBg: 'rgba(242,193,78,0.14)', icon: 'M12 3l10 18H2zM12 10v5M12 18h.01', valColor: active.length ? '#F2C14E' : '#7EE08A',
        line: '', area: '', spark: '#F2C14E',
        pick: () => this.setState({ alertsOnly: !st.alertsOnly })
      }
    ];

    const f = (v, n) => (dash ? '—' : wxN(v, n));
    const heroC = dash ? '#666B73' : cScale(L.stops, val(s));
    const diff = dash ? 0 : val(s) - avgOf(st.layer);
    const d = {
      id: s.id, name: s.name, place: s.place, model: s.model, kind: s.kind,
      stLabel: C_ST[code].label, stFg: C_ST[code].fg, stBg: C_ST[code].bg,
      heroValue: f(val(s), L.dec), heroColor: dash ? heroC : cText(heroC),
      heroBg: 'linear-gradient(135deg, ' + cRgba(heroC, 0.16) + ', ' + cRgba(heroC, 0.03) + ')', heroBorder: cRgba(heroC, 0.30),
      diff: dash ? '—' : (diff >= 0 ? '+' : '−') + wxN(Math.abs(diff), L.dec) + ' ' + L.unit,
      diffColor: dash ? '#A4A9B1' : Math.abs(diff) < 0.05 ? '#A4A9B1' : diff > 0 ? '#F2C14E' : '#F2928A',
      tiles: [
        { label: 'Temperatura', value: f(s.t, 1), unit: '°C', color: dash ? '#666B73' : cText(cScale(C_LAYERS.t.stops, s.t)) },
        { label: 'Sensação', value: dash ? '—' : wxN(wxFeels(s.t, s.h), 1), unit: '°C', color: '#F2F3F5' },
        { label: 'Umidade', value: f(s.h, 0), unit: '%', color: '#F2F3F5' },
        { label: 'Pressão', value: f(s.p, 1), unit: 'hPa', color: '#F2F3F5' },
        { label: 'Chuva', value: f(s.rain, 1), unit: 'mm/h', color: !dash && s.rain > 0 ? '#FFFFFF' : '#F2F3F5' },
        { label: 'Bateria', value: Math.round(s.bat) + '', unit: '%', color: s.bat < 25 ? '#FF7A6B' : s.bat < 50 ? '#F2C14E' : '#7EE08A' }
      ],
      wind: f(s.w, 1), gust: f(s.gust, 1), wd: dash ? '—' : wxDir(s.deg),
      windFrom: dash ? '—' : Math.round(((s.deg % 360) + 360) % 360), windDeg: Math.round(s.deg + 180),
      alerts: active.filter((e) => e.sid === s.id).map((e) => ({
        title: e.title, fg: e.level === 'crit' ? '#FF7A6B' : '#F2C14E',
        bg: e.level === 'crit' ? 'rgba(255,122,107,0.10)' : 'rgba(242,193,78,0.10)',
        border: e.level === 'crit' ? 'rgba(255,122,107,0.35)' : 'rgba(242,193,78,0.35)',
        ack: () => { this.setState({ acked: Object.assign({}, st.acked, { [e.key]: true }) }); this.wxNotify('Alerta de ' + e.sid + ' reconhecido'); }
      }))
    };
    const chart = Object.assign(wxChart(s.hist[st.layer], st.times, L.dec, L.unit, dash ? -1 : st.hover, 360, 104), { aria: 'Gráfico de ' + L.label + ' de ' + s.id });
    const go = (dir) => () => this.setState({ selected: all[(idx + dir + all.length) % all.length].id, hover: -1 });
    const todayStr = new Date(st.now).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    const z = st.zoom;
    return {
      today: todayStr.charAt(0).toUpperCase() + todayStr.slice(1) + ' · 8 estações no solo e em edificações',
      clock: wxTime(new Date(st.now)),
      liveLabel: st.paused ? 'Pausado' : 'Ao vivo', liveDot: st.paused ? '#A4A9B1' : '#F2928A', liveClass: st.paused ? '' : 'c-live',
      pauseLabel: st.paused ? 'Retomar' : 'Pausar', pauseIcon: st.paused ? 'M7 4l12 8-12 8z' : 'M8 5v14M16 5v14',
      togglePause: () => this.setState({ paused: !st.paused }),
      intervals: [1, 2, 5].map((n) => ({
        label: n + 's', pressed: st.interval === n ? 'true' : 'false',
        bg: st.interval === n ? 'linear-gradient(90deg, #4D2A2B, #8B2B29)' : 'transparent', fg: st.interval === n ? '#F2F3F5' : '#D3D6DB',
        pick: () => this.setState({ interval: n }, () => this.wxSchedule())
      })),
      layerName: L.label, layerNameLower: L.label.toLowerCase(), layerUnit: L.unit,
      kindFilters: ['Todas', 'Solo', 'Edifício'].map((k) => ({
        label: k, pressed: st.kind === k ? 'true' : 'false',
        bg: st.kind === k ? '#F2F3F5' : 'transparent', fg: st.kind === k ? '#0E0F11' : '#D3D6DB',
        pick: () => this.setState({ kind: k })
      })),
      list: list, netBar: netBar, netLabel: counts.online + '/' + all.length + ' online',
      halos: halos, markers: markers, pop: pop, layers: layers,
      zoom: z, zoomOrigin: zoomOrigin, zoomLabel: Math.round(z * 100) + '%',
      zoomIn: () => this.setState({ zoom: Math.min(2, +(z + 0.25).toFixed(2)) }),
      zoomOut: () => this.setState({ zoom: Math.max(1, +(z - 0.25).toFixed(2)) }),
      zoomReset: () => this.setState({ zoom: 1 }),
      legendGradient: legendGradient,
      legendLo: fmtStop(stops[0][0]), legendMid: fmtStop(stops[Math.floor(stops.length / 2)][0]), legendHi: fmtStop(stops[stops.length - 1][0]) + '+',
      kpis: kpis, d: d, chart: chart, chartColor: heroC === '#666B73' ? '#A4A9B1' : heroC,
      chartMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        if (!r.width) return;
        const i = Math.round(wxClamp((e.clientX - r.left) / r.width, 0, 1) * (WX_HIST - 1));
        if (i !== st.hover) this.setState({ hover: i });
      },
      chartLeave: () => this.setState({ hover: -1 }),
      prevSensor: go(-1), nextSensor: go(1),
      actions: [
        { label: 'Ler agora', icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', bg: 'linear-gradient(90deg, #4D2A2B, #8B2B29)', fg: '#F2F3F5', border: 'none', run: () => { this.wxTick(); this.wxNotify('Leitura solicitada a ' + s.id); } },
        { label: 'Calibrar', icon: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4', bg: 'transparent', fg: '#F2F3F5', border: '1px solid #474B52', run: () => this.wxNotify('Calibração agendada para ' + s.id) },
        { label: 'Reiniciar', icon: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5', bg: 'transparent', fg: '#F2F3F5', border: '1px solid #474B52', run: () => this.wxNotify('Reinício enviado para ' + s.id) }
      ],
      hasToast: !!st.toast, toast: st.toast
    };
  }
}


render(html`<${App} />`, document.getElementById('stage'));

function fit() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();
})();
</script>
</body>
</html>
